name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a Claude Code release that breaks the band shows here within
  # a day instead of on the next merge.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on main and
# the nightly each get a group of their own, so none is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check (claude-code ${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Each version's result on its own: red on latest alone is a Claude
      # Code release, red on both is the change.
      fail-fast: false
      matrix:
        # The pin is the last version known good. Bump it on purpose, once
        # latest is green, never to get a red run green.
        claude-code: [latest, 2.1.299]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
          claude --version
      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/nextcost
      - name: Test
        run: claude plugin test plugins/nextcost
      - name: Views never format
        run: tools/views-gate.sh
      # No type check here: the engine writes its API types only when a
      # signed-in session loads the plugin. See CONTRIBUTING.md.

  lint:
    name: lint (shellcheck, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell scripts
        run: git ls-files -z 'tools/*.sh' | xargs -0 shellcheck -x
      - name: Python
        run: pipx run ruff==0.17.1 check tools
